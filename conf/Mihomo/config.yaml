# 混合代理端口，用于接收 HTTP、HTTPS 和 SOCKS5 的请求
mixed-port: 7890
# 是否启用 IPv6 支持
ipv6: false
# 是否允许局域网设备通过本地代理访问
allow-lan: true
# 代理程序监听的地址，'*' 表示监听所有网络接口
bind-address: '*'
# 代理模式：rule（按规则分流）、global（全局代理）、direct（全局直连）
mode: rule
# 日志级别：warning（警告）、info（一般信息）、debug（调试）
log-level: info
# 是否并发建立 TCP 连接，以减少连接建立阶段的等待时间
tcp-concurrent: true

# ==================== 外部控制器与面板 ====================
# Clash Party 已内置外部控制面板选择与管理，无需在此重复配置。
# 以下配置仅作备忘，默认不启用。
# 如以后更换为其他客户端，可按需取消注释并修改。

# 外部控制器 API 监听地址；仅绑定本机回环地址，避免直接暴露到局域网
# external-controller: 127.0.0.1:9090 不需要
# 外部控制面板的本地目录
# external-ui: ui
# 外部控制面板的下载地址；首次使用或目录缺失时可供客户端获取面板文件
# external-ui-url: "https://gh-proxy.com/https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
# API CORS 标头配置
# external-controller-cors:
#   # 允许来自任意来源的网页通过浏览器跨域访问 API
#   allow-origins:
#     - '*'
#   # 允许符合浏览器私有网络访问限制条件的请求访问本机或局域网中的控制器
#   allow-private-network: true
# ==================== 外部控制器与面板 ====================

# ==================== GUI 管理的核心设置 ====================
# 以下设置交由 Clash Party GUI 管理，默认不在 YAML 中启用。
# 如以后更换客户端，可根据需要恢复。

# 进程匹配模式：strict 表示严格匹配发起连接的进程
# find-process-mode: strict
# 全局 TLS 客户端指纹已弃用，不建议恢复使用
# global-client-fingerprint: chrome

# 程序运行时的配置存储选项
# profile:
#   # 是否保存用户上次选择的代理节点
#   store-selected: true
#   # 是否启用追踪模式（用于调试）
#   tracing: false
#   # 是否保存虚拟 IP 映射，适用于 fake-ip 模式
#   store-fake-ip: true

# 统一延迟优化，减少规则解析对性能的影响
# unified-delay: true

# 流量嗅探配置：尝试从连接中识别真实访问域名，辅助规则分流
# sniffer:
#   # 是否启用流量嗅探
#   enable: true
#   # 指定需要嗅探的协议及目标端口
#   sniff:
#     # HTTP 流量嗅探设置
#     HTTP:
#       # 对 80 端口及 8080–8880 端口范围进行 HTTP 嗅探
#       ports: [80, 8080-8880]
#       # 使用嗅探到的域名覆盖原始目标信息，辅助域名规则匹配
#       override-destination: true
#     # TLS/HTTPS 握手嗅探设置
#     TLS:
#       # 对常见 HTTPS 端口进行 TLS 嗅探
#       ports: [443, 8443]
#     # QUIC 协议嗅探设置
#     QUIC:
#       # 对常见 QUIC 端口进行嗅探
#       ports: [443, 8443]
#   # 以下域名跳过嗅探，避免对指定服务进行域名覆写
#   skip-domain:
#     # 小米云相关流量
#     - "Mijia Cloud"
#     # Apple 推送通知服务
#     - "+.push.apple.com"

# TUN 虚拟网卡配置：接管系统网络流量并交由规则进行分流
# tun:
#   # 是否启用 TUN 模式
#   enable: true
#   # TUN 网络协议栈；mixed 的具体实现行为取决于核心版本
#   stack: mixed
#   # 劫持发往 53 端口的 DNS 请求，交由内置 DNS 处理
#   dns-hijack:
#     # 劫持任意地址的 UDP DNS 请求
#     - "any:53"
#     # 劫持任意地址的 TCP DNS 请求
#     - "tcp://any:53"
#   # 自动配置系统路由，将流量导入 TUN
#   auto-route: true
#   # 自动重定向符合条件的流量；支持情况取决于系统与核心版本
#   auto-redirect: true
#   # 自动检测出口网卡，减少路由回环风险
#   auto-detect-interface: true
# ==================== GUI 管理的核心设置 ====================

# 内置 DNS 配置
dns:
  # 是否启用内置 DNS 服务
  enable: true
  # DoH 优先使用 HTTP/3
  prefer-h3: false
  # 禁用 IPv6 DNS 解析，与顶层 ipv6 设置保持一致
  ipv6: false
  # DNS 服务监听，支持 UDP 和 TCP
  # 指定内置 DNS 服务的监听地址及端口
  # 1053 为非标准 DNS 端口
  # 如需让局域网设备直接使用本机 DNS，应配置监听地址
  # 并在其他设备上指定本机 IP 和 DNS 端口
  # 默认不单独开放 DNS 监听
  # listen: 0.0.0.0:1053
  # DNS 增强模式：fake-ip
  enhanced-mode: fake-ip
  # 虚拟 IP 地址范围
  fake-ip-range: '198.18.0.1/16'
  # 使用系统 hosts，使用下方自定义 hosts
  use-system-hosts: true
  use-hosts: true
  # 默认引导 DNS：用于解析 DNS 服务器自身的域名
  default-nameserver:
    - 119.29.29.29  # 腾讯 DNSPod 公共 DNS
    - 223.5.5.5     # 阿里公共 DNS，作为备用引导 DNS
  # 常规域名解析服务器：使用加密 DNS（DoH）
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  # 备用 DNS：当 fallback-filter 判断主 DNS 结果不合适时，使用海外 DoH 重新解析
  fallback:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  # 备用 DNS 的过滤规则
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
  # 用于解析代理节点服务器域名的 DNS；同样优先使用腾讯 DNSPod
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - tls://dot.pub:853
    - https://dns.alidns.com/dns-query
    - tls://223.5.5.5:853
  # 仅当代理节点服务器域名属于 *.251313.xyz 时，才按需启用以下专用策略
  # proxy-server-nameserver-policy:
  #   "+.123.xyz":
  #     - https://dns.alidns.com/dns-query
  #     - tls://223.5.5.5:853
  # fake-ip 模式下返回真实 IP 的域名列表
  fake-ip-filter:
    # 匹配 .lan 局域网域名
    - '*.lan'
    # 匹配 .local 本地域名
    - '*.local'
    # 腾讯本地登录服务
    - localhost.ptlogin2.qq.com
    # Windows 网络连通性检测
    - dns.msftncsi.com
    # Nintendo Switch 服务
    - '*.srv.nintendo.net'
    # PlayStation STUN 服务
    - '*.stun.playstation.net'
    # Xbox 相关服务
    - 'xbox.*.microsoft.com'
    # Xbox Live 服务
    - '*.xboxlive.com'

# 本地服务器
proxies:
  - name: 🇺🇸 US California
    type: socks5
    server: example.com
    port: 8888
    username: name
    password: pwd

# 节点提供商配置
proxy-providers:
  # SSRDOG 节点订阅提供商配置
  SSRDOG:
    # 通过 HTTP(S) 订阅地址获取节点列表
    type: http
    # 每隔 86400 秒（24 小时）更新一次节点信息
    interval: 86400
    # 提供商的订阅链接
    # 订阅地址占位符：请替换为 SSRDOG 实际订阅链接
    url: url

# 功能策略组
proxy-groups:
  # 通用手动代理选择组，可手动选择节点或其他策略组
  - name: Proxy
    # 策略组图标，仅影响客户端界面显示
    icon: https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
    # 测速间隔，单位为秒；主要用于测速策略组，14400 秒为 4 小时
    interval: 14400
    # 懒惰测速选项：主要用于测速策略组，具体是否生效取决于策略组类型
    lazy: true
    # 延迟切换容差，单位为毫秒；主要用于自动测速策略组
    tolerance: 10
    # 策略组类型为 select，表示由用户手动选择
    type: select
    # 自动纳入配置中可用的代理节点
    include-all: true

  # 通用自动测速组，根据测速结果选择延迟较低的节点
  - name: Auto
    # 策略组图标，仅影响客户端界面显示
    icon: https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
    # 测速间隔，单位为秒；主要用于测速策略组，14400 秒为 4 小时
    interval: 14400
    # 懒惰测速选项：主要用于测速策略组，具体是否生效取决于策略组类型
    lazy: true
    # 延迟切换容差，单位为毫秒；主要用于自动测速策略组
    tolerance: 10
    # 策略组类型为 url-test，表示通过 URL 测速自动选择节点
    type: url-test
    # 连通性测试 URL，通常供 url-test 等测速策略组使用
    url: http://cp.cloudflare.com/generate_204
    # 自动纳入配置中可用的代理节点
    include-all: true
    # 节点名称筛选正则表达式，只让符合条件的节点进入该组
    filter: "(?i)^(?!.*(?:GB|Days|Left|Expire|Date)).*"

  # 兜底策略组；未被前面规则命中的流量会进入此组
  - name: Uncaptured
    # 策略组图标，仅影响客户端界面显示
    icon: https://gh-proxy.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png
    # 策略组类型为 select，表示由用户手动选择
    type: select
    # 此策略组允许选择的策略组或代理节点列表
    proxies: [Proxy,DIRECT,Hong Kong,Taiwan,Japan,South Korea,Singapore,United States,Other Regions,Auto]

