#分流规则引用
rules:

  # Apple LBS
  # DOMAIN-SUFFIX,iphone-ld.apple.com,DIRECT
  # DOMAIN-SUFFIX,lcdn-locator.apple.com,DIRECT
  # DOMAIN-SUFFIX,lcdn-registration.apple.com,DIRECT
  # DOMAIN-SUFFIX,push.apple.com,DIRECT
  # Apple OCSP
  # PROCESS-NAME,trustd,Proxy

  # AI 聊天服务流量交由 AI 策略组
  - RULE-SET,AI_domain,AI
  # GitHub 流量交由 Github 策略组
  - RULE-SET,github_domain,Github
  # Google 流量交由 Google 策略组
  - RULE-SET,google_domain,Google
  # Apple 流量交由 Apple 策略组
  - RULE-SET,apple_domain,Apple
  # Microsoft 流量交由 Microsoft 策略组
  - RULE-SET,microsoft_domain,Microsoft
  # LinkedIn 流量交由 LinkedIn 策略组
  - RULE-SET,linkedin_domain,LinkedIn
  # PayPal 流量交由 PayPal 策略组
  - RULE-SET,paypal_domain,PayPal
  # YouTube 流量交由 YouTube 策略组
  - RULE-SET,youtube_domain,YouTube
  # X 流量交由 X 策略组
  - RULE-SET,x_domain,X
  # Netflix 流量交由 NETFLIX 策略组
  - RULE-SET,netflix_domain,NETFLIX
  # Spotify 流量交由 Spotify 策略组
  - RULE-SET,spotify_domain,Spotify
  # Disney+ 流量交由 Disney+ 策略组
  - RULE-SET,disney_domain,Disney+
  # TikTok 流量交由 TikTok 策略组
  - RULE-SET,tiktok_domain,TikTok
  # Telegram 流量交由 Telegram 策略组
  - RULE-SET,telegram_domain,Telegram
  # CN 域名直接连接
  - RULE-SET,cn_domain,DIRECT
  # RULE-SET,geolocation-!cn,Uncaptured
  # 私有、局域网及本地域名直接连接
  - RULE-SET,private_domain,DIRECT

  # 私有/局域网 IP 直接连接，且不额外进行域名解析
  - RULE-SET,private_ip,DIRECT,no-resolve
  # RULE-SET,cn_ip,China
  # RULE-SET,google_ip,Google
  # RULE-SET,netflix_ip,NETFLIX
  # RULE-SET,x_ip,X
  # RULE-SET,telegram_ip,Telegram
  # 目标 IP 属于局域网地址时直接连接
  - GEOIP,LAN,DIRECT,no-resolve
  # 目标 IP 地理位置匹配中国时直接连接
  - GEOIP,CN,DIRECT
  # 最终兜底规则：其余未匹配流量交由 Uncaptured 策略组
  - MATCH,Uncaptured

# 脚本
# script:
  # shortcuts:
    # quic: network == 'udp' and dst_port == 443
    # 功能：
      # 定义一个快捷规则 quic，用来匹配所有使用 UDP 且目标端口为 443 的流量
      # 该规则不会直接影响流量，只是用于标记或匹配 QUIC 流量
    # 使用场景：
      # 分流：识别 QUIC 流量后，将其分配到不同的代理组或直接连接
      # 阻止：在不使用 QUIC 时，配合 REJECT 规则禁止其通过
